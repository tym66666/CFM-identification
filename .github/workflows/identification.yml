name: Identification research checks

on:
  push:
    paths:
      - '**'
      - '.github/workflows/identification.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/identification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ID-only runtime without Torch or full pipeline
        run: python -m pip install -e ".[documents]" pytest jsonschema
      - name: Web and review boundaries
        run: python -m pytest demo/tests -q
      - name: Page interactions
        run: node --test demo/tests/test_review_ui.cjs
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Install this standalone Identification package from the repository root.
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test,documents]"
      - name: Check package provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import cfm_id, cfm_id_llm, pfn_pipeline
          root = Path.cwd().resolve()
          for module in (cfm_id, cfm_id_llm, pfn_pipeline):
              assert root in Path(module.__file__).resolve().parents, module.__name__
          PY
      - name: Verify frozen benchmark inputs
        run: python -c "from evaluation.nbib_acceptance import validate; print(validate())"
      - name: Offline regression
        run: python scripts/check_offline.py
      - name: Fixed framework acceptance
        run: python scripts/check_framework.py --output outputs/framework_acceptance/ci
      - name: Save framework acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identification-framework-acceptance
          path: |
            outputs/framework_acceptance/ci/SUMMARY.json
            outputs/framework_acceptance/ci/MANIFEST.json
            outputs/framework_acceptance/ci/SOURCE_SHA256.json
            outputs/framework_acceptance/ci/junit.xml
          if-no-files-found: warn
